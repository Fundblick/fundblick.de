<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="styles.css">
  <title>Produktsuche – FundBlick</title>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt</a>
  <header class="topbar"><div class="wrap nav"><a class="brand" href="/">Fund<span>Blick</span></a><a href="/">Startseite</a></div></header>
  <main id="main" class="wrap results-page">
    <form class="search-form" action="search.html" method="get" role="search"><label class="sr-only" for="query">Produkte suchen</label><input id="query" name="q" type="search" placeholder="Produkt, Marke oder Eigenschaft …" autocomplete="off"><button type="submit">Suchen</button></form>
    <div class="results-heading"><div><p class="eyebrow">FUNDBLICK PRODUKTSUCHE</p><h1>Suchergebnisse</h1><p id="summary" role="status" aria-live="polite">Produkte werden geladen …</p></div><label for="sort">Sortieren <select id="sort"><option value="relevance">Beste Treffer</option><option value="price-asc">Preis: aufsteigend</option><option value="price-desc">Preis: absteigend</option><option value="brand">Hersteller</option></select></label></div>
    <div id="chips" class="chips" aria-label="Aktive Filter"></div>
    <div class="results-layout">
      <details id="filter-panel" class="filter-panel" open><summary>Suche verfeinern</summary><div id="filters"></div><button id="reset" class="reset" type="button">Alle Filter zurücksetzen</button></details>
      <section aria-label="Produkte"><div id="cards" class="product-grid"></div></section>
    </div>
    <p class="data-note">Testdaten ohne kaufbare Händlerangebote. Angezeigte Preise enthalten keine nachgewiesenen Versandkosten.</p>
  </main>
  <footer class="footer"><div class="wrap"><span>FundBlick</span><nav aria-label="Rechtliches"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></nav></div></footer>
  <script src="search.js" defer></script>
</body>
</html>
