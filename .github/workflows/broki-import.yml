name: Broki Product Import

on:
  workflow_dispatch:
    schedule:
        - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  import-products:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Produkte importieren
        run: node scripts/import-products.js
      - name: Platzi-Produkte importieren
        run: node scripts/import-platzi-products.js

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an products.json."
          else
            git commit -m "Update products via Broki"
            git push
          fi
