name: Result card safety

on:
  push:
    branches: [development]
    paths:
      - 'live-catalog-ui.js'
      - 'merchant-offers.js'
      - 'verify-merchant-offers.js'
      - 'result-card.css'
      - 'result-card-e2e.spec.js'
      - 'external-search-e2e.spec.js'
      - 'external-search*.js'
      - 'external-price*.js'
      - 'external-result-page.js'
      - 'external-intelligence-ui.js'
      - 'product-*.js'
      - 'external-search.css'
      - 'search.html'
      - '.github/workflows/result-card-safety.yml'
      - '.github/workflows/production-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'live-catalog-ui.js'
      - 'merchant-offers.js'
      - 'verify-merchant-offers.js'
      - 'result-card.css'
      - 'result-card-e2e.spec.js'
      - 'external-search-e2e.spec.js'
      - 'external-search*.js'
      - 'external-price*.js'
      - 'external-result-page.js'
      - 'external-intelligence-ui.js'
      - 'product-*.js'
      - 'external-search.css'
      - 'search.html'
      - 'affiliate-*.js'
      - 'production-catalog-sources.json'
      - 'production-merchant-approvals.json'
      - 'build-production-catalog.js'
      - '.github/workflows/result-card-safety.yml'
      - '.github/workflows/production-pages.yml'

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and voucher contract checks
        run: |
          node --check live-catalog-ui.js
          node --check merchant-offers.js
          node --check verify-merchant-offers.js
          node --check result-card-e2e.spec.js
          node verify-merchant-offers.js
      - name: Build real production catalog
        run: |
          node build-production-catalog.js build/catalog
          node verify-live-catalog-v2.js build/catalog
          node prepare-amazgifts-e2e.js
          rm -rf catalog
          cp -R build/catalog catalog
      - name: Verify card production wiring
        run: |
          test -s result-card.css
          grep -q 'result-card.css' search.html
          grep -q 'merchant-offers.js' search.html
          grep -q 'live-catalog-ui.js' search.html
          grep -q 'merchant-offers.js' public-site-files.json
          grep -q 'result-card.css' public-site-files.json
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/fundblick-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/search.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fundblick-http.log
          exit 1
      - name: Browser result card and voucher regression
        run: npx playwright test result-card-e2e.spec.js external-search-e2e.spec.js --reporter=line --workers=1
