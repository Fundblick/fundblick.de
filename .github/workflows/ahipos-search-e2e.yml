name: AHIPOS search browser gate
on:
  push:
    branches: [dev/ahipos-v1]
    paths:
      - 'development/ahipos-products-*.json'
      - 'build-ahipos-development-catalog.js'
      - 'facet-schemas.js'
      - 'equestrian-search-extension.js'
      - 'equestrian-taxonomy-i18n.js'
      - 'search.html'
      - 'search.js'
      - 'catalog-loader.js'
      - 'live-catalog-ui.js'
      - 'ahipos-search-e2e.spec.js'
      - '.github/workflows/ahipos-search-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build isolated AHIPOS development catalog
        run: |
          node build-ahipos-development-catalog.js build/ahipos-catalog
          rm -rf catalog
          cp -R build/ahipos-catalog catalog
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/fundblick-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/search.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fundblick-http.log
          exit 1
      - name: Desktop, mobile and RU AHIPOS search
        run: npx playwright test ahipos-search-e2e.spec.js --reporter=line --workers=1
