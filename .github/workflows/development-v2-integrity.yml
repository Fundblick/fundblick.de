name: Development V2 integrity
on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node development/verify-catalog.js
      - run: node development/verify-publication-apply.js
      - run: node development/verify-seo-preview-apply.js
      - run: node development/verify-delivery-contract.js
      - run: node development/verify-merchant-handoff.js
      - run: node development/verify-outbound-click.js
      - run: node development/verify-ui-language.js
      - run: node development/verify-frontend-language.js
      - run: node development/verify-search-routing.js
      - run: node development/verify-substring-routing.js
      - run: node development/verify-substring-browser-shadow.js
      - run: node development/verify-search-shadow.js
      - run: node search-sort-runtime.test.js
      - run: node verify-public-catalog-boundary.js
      - run: node verify-affiliate-consent.js
      - run: node verify-merchant-offers.js
      - run: node verify-merchant-feed-registry.js
      - run: node verify-anthbot-feed.js
      - run: node verify-anthbot-search-facets.js
      - run: node verify-robot-mower-classifier.js
      - run: node verify-external-search-client.js
      - run: node verify-external-search-policy.js
      - run: node verify-external-search-ui.js
      - run: node verify-external-price-confidence.js
      - run: node verify-search-intent-query.js
      - run: node verify-universal-search-intent.js
      - run: node verify-external-offer-quality.js
