name: Amazgifts catalog integration gate
on:
  push:
    branches: [development]
    paths:
      - 'amazgifts-feed-normalizer.js'
      - 'merchant-feed-registry.js'
      - 'build-merchant-feed-catalog.js'
      - 'build-amazgifts-development-catalog.js'
      - 'verify-amazgifts-normalizer.js'
      - 'facet-schemas.js'
      - 'search-facet-engine-v2.js'
      - 'verify-facet-engine-v2.js'
      - 'build-normalized-merchant-artifact-catalog.js'
      - '.github/workflows/amazgifts-catalog-integration.yml'
  workflow_dispatch:
    inputs:
      feed_path:
        description: 'Optional path to Amazgifts Awin CSV/CSV.GZ already available in workspace'
        required: false
        default: ''
      artifact_path:
        description: 'Optional path to normalized Amazgifts .json.gz.b64 already available in workspace'
        required: false
        default: ''
jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check amazgifts-feed-normalizer.js
      - run: node --check merchant-feed-registry.js
      - run: node --check build-merchant-feed-catalog.js
      - run: node --check build-amazgifts-development-catalog.js
      - run: node verify-amazgifts-normalizer.js
      - run: node verify-merchant-feed-registry.js
      - run: node verify-facet-engine-v2.js
      - run: node --check build-normalized-merchant-artifact-catalog.js
  build-with-feed:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build explicitly supplied Amazgifts source
        env:
          FEED_PATH: ${{ inputs.feed_path }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail
          if [ -n "$FEED_PATH" ] && [ -n "$ARTIFACT_PATH" ]; then echo 'Choose feed_path or artifact_path, not both.'; exit 1; fi
          if [ -n "$ARTIFACT_PATH" ]; then
            test -f "$ARTIFACT_PATH" || { echo 'Requested Amazgifts artifact is not present in workspace.'; exit 1; }
            node build-normalized-merchant-artifact-catalog.js amazgifts "$ARTIFACT_PATH" build/amazgifts-catalog
          elif [ -n "$FEED_PATH" ]; then
            test -f "$FEED_PATH" || { echo 'Requested Amazgifts feed is not present in workspace.'; exit 1; }
            node build-amazgifts-development-catalog.js "$FEED_PATH" build/amazgifts-catalog
          else
            echo 'Supply feed_path or artifact_path explicitly.'; exit 1
          fi
          node verify-live-catalog-v2.js build/amazgifts-catalog