name: Production release check

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
    paths:
      - 'production-catalog-sources.json'
      - 'production-merchant-approvals.json'
      - 'production-merchant-artifacts.json'
      - 'merchant-production-artifact.js'
      - 'merchant-product-quality.js'
      - 'verify-merchant-product-quality.js'
      - 'development/amazgifts-verified-products*'
      - 'development/blazevideo-verified-products*'
      - 'verify-blazevideo-selection.js'
      - 'blazevideo-e2e.spec.js'
      - 'destination-link-*.js'
      - 'audit-destination-links.js'
      - 'verify-destination-link-health.js'
      - 'destination-link-policy.json'
      - 'destination-health/**'
      - 'activate-amazgifts-production.js'
      - 'build-production-catalog.js'
      - 'build-live-catalog.js'
      - 'package-site.js'
      - 'public-site-files.json'
      - 'verify-site-*.js'
      - 'verify-deployed-site.js'
      - 'catalog-loader.js'
      - 'live-health.js'
      - 'verify-live-health.js'
      - 'results-paging.js'
      - 'results-paging.css'
      - 'build-versioned-site.js'
      - 'build-seo-landings.js'
      - 'verify-production-*.js'
      - 'verify-live-catalog-v2.js'
      - 'verify-google-indexability.js'
      - 'affiliate-*.js'
      - 'live-catalog-ui.js'
      - 'search.html'
      - 'index.html'
      - 'home-i18n.js'
      - 'verify-homepage.js'
      - 'verify-language-navigation.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/production-release-check.yml'
      - '.github/workflows/production-pages.yml'

permissions:
  contents: read

concurrency:
  group: fundblick-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Verify portable browser package
        run: node verify-site-portability.js
      - name: Current homepage and language navigation contracts
        run: |
          node verify-homepage.js
          node verify-language-navigation.js
      - name: Validate production JavaScript
        run: |
          for f in prepare-amazgifts-e2e.js export-amazgifts-artifact.js merchant-artifact-integrity.js activate-amazgifts-production.js verify-amazgifts-live-readiness.js home-i18n.js deal-of-day.js home-deal.js home-categories.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js search-state-guard.js catalog-loader.js image-fallback.js search.js coupon-engine.js merchant-offers.js search-relevance.js facet-value-i18n.js common-filter-i18n.js search-mobile.js results-paging.js page-meta-i18n.js live-health.js language-links.js equestrian-search-extension.js equestrian-taxonomy-i18n.js affiliate-config.js affiliate-consent-version.js affiliate-consent.js affiliate-link-policy.js affiliate-outbound.js live-catalog-ui.js build-live-catalog.js build-production-catalog.js build-seo-landings.js audit-seo-landing-candidates.js build-versioned-site.js verify-live-catalog-v2.js verify-production-merchants.js verify-production-categories.js verify-deal-of-day.js verify-production-deal.js verify-coupon-engine.js verify-merchant-offers.js verify-affiliate-routing.js verify-user-flows.js verify-google-indexability.js; do node --check "$f"; done
          for f in search-static-i18n.js taxonomy-value-i18n.js category-query-router.js universal-search-intent.js search-intent-query.js search-intent-ui.js search-facet-engine-v2.js search-render-signal.js search-sort-runtime.js external-search-policy.js external-search-client.js external-search-i18n.js external-price-evidence.js external-search-ui.js external-price-confidence.js product-storage-parser.js product-fashion-attributes.js product-intelligence-core.js semantic-product-resolver.js semantic-taxonomy-adapter.js query-facet-blueprint.js query-blueprint-ui.js product-query-strategy.js product-unit-normalizer.js product-result-attribute-extractor.js product-result-deduper.js product-facet-engine.js product-constraint-ranker.js product-conflict-filter.js refinement-utility.js refinement-query-terms.js refinement-ui.js product-intelligence-pipeline.js external-intelligence-ui.js external-result-page.js external-search-runtime.js verify-query-facet-blueprint.js verify-query-to-facet-integration.js verify-generic-semantic-facets.js verify-product-facet-frequency.js verify-refinement-query-terms.js; do node --check "$f"; done
          node verify-query-facet-blueprint.js
          node verify-semantic-product-resolver.js
          node verify-generic-semantic-facets.js
          node verify-query-to-facet-integration.js
          node verify-refinement-utility.js
          node verify-refinement-query-terms.js
          node verify-product-facet-frequency.js
          node verify-external-intelligence-ui.js
      - name: Build and validate production catalog
        run: |
          node verify-destination-link-health.js
          node verify-merchant-product-quality.js
          node verify-merchant-feed-registry.js
          node verify-merchant-artifact-integrity.js
          node verify-amazgifts-live-readiness.js
          node verify-deal-of-day.js
          node verify-merchant-offers.js
          node build-production-catalog.js build/catalog
          node verify-live-catalog-v2.js build/catalog
          node verify-production-merchants.js build/catalog
          node verify-production-categories.js build/catalog
          node verify-production-deal.js build/catalog
          node verify-coupon-engine.js build/catalog
          node verify-affiliate-routing.js
          node verify-user-flows.js build/catalog
          node verify-live-health.js
          node verify-site-packaging.js
          node prepare-amazgifts-e2e.js
          node audit-seo-landing-candidates.js
          node build-seo-landings.js build/catalog build/seo
          node verify-google-indexability.js build/seo
          test "$(find build/seo/themen -name index.html | wc -l)" -eq 6
          test -s build/seo/sitemap.xml
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/catalog/manifest.json'));if(m.dataMode!=='real'||m.realCount<1000||m.simulatedCount!==0)process.exit(1);console.log('Real production gate OK',m.realCount)"
          ! grep -R -E 'DemoMarkt|ShopTest|PreisDemo|FundBlick Simulator|Test-Gutschein' development/core-products.json development/ahipos-products-1.json development/ahipos-products-2.json build/catalog
      - name: Verify production wiring
        run: |
          grep -q 'data-catalog-url="catalog-live"' search.html
          grep -q 'merchant-offers.js' search.html
          grep -q 'live-catalog-ui.js' search.html
          grep -q 'result-card.css' search.html
          grep -q 'semantic-taxonomy-adapter.js' search.html
          grep -q 'query-facet-blueprint.js' search.html
          grep -q 'query-blueprint-ui.js' search.html
          grep -q 'external-search-runtime.js' search.html
          grep -q 'refinement-query-terms.js' search.html
          grep -q 'equestrian-search-extension.js' search.html
          grep -q 'equestrian-taxonomy-i18n.js' search.html
          grep -q 'search.html?category=home.living' index.html
          grep -q 'search.html?category=home.furniture' index.html
          grep -q 'search.html?category=home.lighting' index.html
          grep -q 'search.html?category=home.decor' index.html
          grep -q 'search.html?category=pet.equestrian' index.html
          grep -q 'search.html?category=pet.dog' index.html
          grep -q 'search.html?category=health.supplements' index.html
          ! grep -q 'href="/themen/' index.html
          grep -q 'home-i18n.js' index.html
          grep -q 'catalog-loader.js' index.html
          grep -q 'deal-of-day.js' index.html
          grep -q 'home-deal.js' index.html
          grep -q 'id="deal-content"' index.html
          grep -q 'home-categories.js' index.html
          test -s build/catalog/categories.json
          test -s build/seo/themen/moebel/index.html
          test -s build/seo/themen/pferd-reitsport/index.html
          grep -q 'https://fundblick.de/themen/moebel/' build/seo/sitemap.xml
          grep -q 'href="/" data-i18n="homeLink"' search.html
          ! grep -q 'product-copy-i18n.js' search.html
          ! grep -q 'offer-comparison.js' search.html
          grep -q "network:'MULTI'" affiliate-config.js
          grep -q "defaultNetwork:'awin'" affiliate-config.js
          grep -q 'enabled:true' affiliate-config.js
          grep -q 'FundBlickAffiliateLinkPolicy' affiliate-link-policy.js
          grep -q 'FundBlickAffiliateOutbound' affiliate-outbound.js
          grep -q 'id="affiliate-awin"' datenschutz.html
          ! grep -q 'Live-Beta' index.html
      - name: Package reviewed public files and version assets
        run: node package-site.js production
      - name: Verify packaged production dependencies
        run: node development/verify-production-package.js _site
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve the final production package
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/fundblick-release-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/search.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fundblick-release-http.log
          exit 1
      - name: Browser tests against hashed production files
        run: npx playwright test result-card-e2e.spec.js external-search-e2e.spec.js search-relevance-e2e.spec.js --reporter=line --workers=1
