name: External search safety gate

on:
  push:
    branches: [development]
    paths:
      - 'external-search-policy.js'
      - 'external-search-client.js'
      - 'external-search-i18n.js'
      - 'external-search-ui.js'
      - 'external-search-runtime.js'
      - 'external-search.css'
      - 'verify-external-search-policy.js'
      - 'verify-external-search-client.js'
      - 'verify-external-search-i18n.js'
      - 'cloudflare/brave-search-worker.js'
      - 'docs/EXTERNAL-SEARCH-WORKPLAN-2026-09-29.md'
      - '.github/workflows/external-search-gate.yml'
  pull_request:
    paths:
      - 'external-search-policy.js'
      - 'external-search-client.js'
      - 'external-search-i18n.js'
      - 'external-search-ui.js'
      - 'external-search-runtime.js'
      - 'external-search.css'
      - 'verify-external-search-policy.js'
      - 'verify-external-search-client.js'
      - 'verify-external-search-i18n.js'
      - 'cloudflare/brave-search-worker.js'
      - 'docs/EXTERNAL-SEARCH-WORKPLAN-2026-09-29.md'
      - '.github/workflows/external-search-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check external-search-policy.js
          node --check external-search-client.js
          node --check external-search-i18n.js
          node --check external-search-ui.js
          node --check external-search-runtime.js
          node --check cloudflare/brave-search-worker.js
      - name: Verify fallback policy
        run: node verify-external-search-policy.js
      - name: Verify external client
        run: node verify-external-search-client.js
      - name: Verify fallback translations
        run: node verify-external-search-i18n.js
      - name: Keep production activation gated
        shell: bash
        run: |
          grep -q 'data-external-search-enabled="false"' search.html
          grep -q 'data-external-search-endpoint=""' search.html
          echo 'External search remains dormant pending desktop Worker verification.'
      - name: Reject committed Brave secrets
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(X-Subscription-Token[[:space:]]*:[[:space:]]*["'"'][A-Za-z0-9_-]{20,}|BRAVE_SEARCH_API_KEY[[:space:]]*=[[:space:]]*["'"'][^"'"']+)' .; then
            echo 'Potential Brave secret committed to repository.' >&2
            exit 1
          fi
          echo 'No committed Brave secret pattern found.'
