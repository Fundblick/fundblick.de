name: SEO landing candidate audit

on:
  push:
    branches: [dev/seo-landing-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check audit-seo-landing-candidates.js
      - name: Audit real production landing candidates
        run: node audit-seo-landing-candidates.js
