name: Publish FundBlick production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fundblick-production-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate live JavaScript
        run: |
          node --check app.js
          node --check i18n.js
          node --check deal-of-day.js
          node --check home-extras.js
          node --check home-categories.js
          node --check home-polish.js
          node --check search-i18n.js
          node --check facet-schemas.js
          node --check category-display-i18n.js
          node --check common-facet-defs.js
          node --check category-aliases.js
          node --check search-intent.js
          node --check search-state-guard.js
          node --check catalog-loader.js
          node --check image-fallback.js
          node --check search.js
          node --check product-copy-i18n.js
          node --check coupon-engine.js
          node --check offer-comparison.js
          node --check search-relevance.js
          node --check facet-value-i18n.js
          node --check common-filter-i18n.js
          node --check search-mobile.js
          node --check results-paging.js
          node --check page-meta-i18n.js
          node --check live-health.js
          node --check language-links.js
          node --check affiliate-config.js
          node --check affiliate-consent-version.js
          node --check affiliate-consent.js
          node --check affiliate-link-policy.js
          node --check affiliate-outbound.js
          node --check adcell-feed-normalizer.js
          node --check site-i18n.js
          node --check build-live-catalog.js
          node --check verify-live-catalog-v2.js
          node --check verify-search-state-v2.js
          node --check verify-live-facets.js
          node --check verify-search-intent.js
          node --check verify-live-health.js
          node --check verify-production-assets.js
          node --check verify-total-price-integrity.js
          node --check verify-language-navigation.js
          node --check verify-category-display-i18n.js
          node --check verify-product-copy-i18n.js
          node --check verify-offer-comparison.js
          node --check verify-coupon-engine.js
          node --check verify-image-fallback.js
          node --check verify-image-quality.js
          node --check verify-affiliate-readiness.js
          node --check verify-affiliate-routing.js
          node --check verify-home-empty-search.js
          node --check verify-homepage-visual.js
          node --check verify-home-polish.js
          node --check verify-customer-meta-paging.js
      - name: Build production catalog
        run: |
          node build-live-catalog.js build/catalog
          node verify-live-catalog-v2.js build/catalog
          node verify-coupon-engine.js build/catalog
      - name: Verify live search assets
        run: |
          grep -q 'language-links.js' index.html
          grep -q 'page-meta-i18n.js' index.html
          grep -q 'deal-of-day.js' index.html
          grep -q 'home-extras.js' index.html
          grep -q 'home-categories.js' index.html
          grep -q 'home-categories.css' index.html
          grep -q 'home-polish.js' index.html
          grep -q 'home-polish.css' index.html
          grep -q 'id="searchFeedback"' index.html
          grep -q 'data-home-build="20260925-live19"' index.html
          grep -q 'id="deal"' index.html
          grep -q 'id="categories"' index.html
          grep -q 'id="categoryToggle"' index.html
          grep -q 'id="categoryMore"' index.html
          test "$(grep -o 'data-category-key=' index.html | wc -l)" -eq 16
          test "$(grep -o 'data-category-primary' index.html | wc -l)" -eq 6
          test "$(grep -o 'data-category-extra' index.html | wc -l)" -eq 10
          ! grep -q 'id="showcaseList"' index.html
          ! grep -q 'Erst das Produkt. Dann die Angebote.' index.html
          ! grep -q 'Product first. Offers second.' index.html
          grep -q 'search-i18n.js' search.html
          grep -q 'facet-schemas.js' search.html
          grep -q 'category-display-i18n.js' search.html
          grep -q 'common-facet-defs.js' search.html
          grep -q 'category-aliases.js' search.html
          grep -q 'search-intent.js' search.html
          grep -q 'search-state-guard.js' search.html
          grep -q 'catalog-loader.js' search.html
          grep -q 'image-fallback.js' search.html
          grep -q 'product-copy-i18n.js' search.html
          grep -q 'coupon-engine.js' search.html
          grep -q 'offer-comparison.js' search.html
          grep -q 'search-relevance.js' search.html
          grep -q 'facet-value-i18n.js' search.html
          grep -q 'common-filter-i18n.js' search.html
          grep -q 'search-mobile.js' search.html
          grep -q 'results-paging.js' search.html
          grep -q 'results-paging.css' search.html
          grep -q 'page-meta-i18n.js' search.html
          grep -q 'live-health.js' search.html
          grep -q 'language-links.js' search.html
          grep -q 'language-links.js' impressum.html
          grep -q 'language-links.js' datenschutz.html
          grep -q 'language-links.js' 404.html
          grep -q 'affiliate-config.js' language-links.js
          grep -q 'affiliate-consent-version.js' language-links.js
          grep -q 'affiliate-consent.js' language-links.js
          grep -q 'affiliate-link-policy.js' language-links.js
          grep -q 'affiliate-outbound.js' language-links.js
          grep -q 'affiliate-consent.css' language-links.js
          grep -q 'id="affiliate-adcell"' datenschutz.html
          grep -q 'data-adcell-live-disclosure="false"' datenschutz.html
          grep -q 'IAB Vendor ID 766' datenschutz.html
          grep -q 'outboundEnabled:false' affiliate-config.js
          grep -q 'FundBlickAffiliateLinkPolicy' affiliate-link-policy.js
          grep -q 'FundBlickAffiliateOutbound' affiliate-outbound.js
          grep -q 'FundBlickAdcellFeedNormalizer' adcell-feed-normalizer.js
          grep -q 'search-mobile.css' search.html
          grep -q 'value="zh-Hans"' search.html
          grep -q "'zh-Hans'" search-i18n.js
          grep -q 'FB_CATEGORY_SCHEMAS' facet-schemas.js
          grep -q 'FB_CATEGORY_DISPLAY_LABELS' category-display-i18n.js
          grep -q 'FB_COMMON_FACETS' common-facet-defs.js
          grep -q 'pistola de calor' category-aliases.js
          grep -q 'FBProductCopyI18n' product-copy-i18n.js
          grep -q 'FundBlickCoupons' coupon-engine.js
          grep -q 'FundBlickOfferComparison' offer-comparison.js
          grep -q 'FundBlickImageFallback' image-fallback.js
          grep -q 'FundBlickAffiliateConfig' affiliate-config.js
          grep -q 'FundBlickAffiliateConsent' affiliate-consent.js
          grep -q 'Filtermaschine' facet-value-i18n.js
          grep -q 'FBCommonFilterI18n' common-filter-i18n.js
          grep -q 'FB_parseSearchIntent' search-intent.js
          grep -q 'FundBlickHealth' live-health.js
          grep -q 'FundBlickLanguageLinks' language-links.js
          grep -q 'mobile-search-tools' search-mobile.css
          grep -q 'data-catalog-url="catalog-live"' search.html
          ! grep -q 'data-catalog-url="development/core-products.json"' search.html
      - name: Test live search logic
        run: |
          node verify-search-state-v2.js
          node verify-live-facets.js
          node verify-search-intent.js
          node verify-live-health.js
          node verify-production-assets.js
          node verify-total-price-integrity.js
          node verify-language-navigation.js
          node verify-category-display-i18n.js
          node verify-product-copy-i18n.js
          node verify-offer-comparison.js
          node verify-coupon-engine.js build/catalog
          node verify-image-fallback.js
          node verify-image-quality.js
          node verify-affiliate-readiness.js
          node verify-affiliate-routing.js
          node verify-home-empty-search.js
          node verify-homepage-visual.js
          node verify-home-polish.js
          node verify-customer-meta-paging.js
      - name: Package production files only
        run: |
          mkdir -p _site
          cp index.html deal-of-day.js home-extras.js home-categories.js home-categories.css home-polish.js home-polish.css search.html search.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js search-state-guard.js catalog-loader.js image-fallback.js product-copy-i18n.js coupon-engine.js offer-comparison.js search-relevance.js facet-value-i18n.js common-filter-i18n.js search-mobile.js search-mobile.css results-paging.js results-paging.css page-meta-i18n.js live-health.js language-links.js affiliate-config.js affiliate-consent-version.js affiliate-consent.js affiliate-link-policy.js affiliate-outbound.js affiliate-consent.css i18n.js app.js styles.css home.css impressum.html datenschutz.html robots.txt sitemap.xml CNAME 404.html _site/
          cp -R build/catalog _site/catalog
          test ! -e _site/adcell-feed-normalizer.js
          test ! -e _site/site-i18n.js
          test ! -e _site/products.json
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
