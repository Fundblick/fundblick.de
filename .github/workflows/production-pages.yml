name: Publish FundBlick production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fundblick-production-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate live JavaScript
        run: |
          node --check app.js
          node --check i18n.js
          node --check search-i18n.js
          node --check facet-schemas.js
          node --check category-aliases.js
          node --check search-intent.js
          node --check search.js
          node --check facet-value-i18n.js
          node --check search-mobile.js
          node --check site-i18n.js
          node --check verify-live-facets.js
          node --check verify-search-intent.js
      - name: Verify live search assets
        run: |
          grep -q 'search-i18n.js' search.html
          grep -q 'facet-schemas.js' search.html
          grep -q 'category-aliases.js' search.html
          grep -q 'search-intent.js' search.html
          grep -q 'facet-value-i18n.js' search.html
          grep -q 'search-mobile.js' search.html
          grep -q 'search-mobile.css' search.html
          grep -q 'value="zh-Hans"' search.html
          grep -q "'zh-Hans'" search-i18n.js
          grep -q 'FB_CATEGORY_SCHEMAS' facet-schemas.js
          grep -q 'pistola de calor' category-aliases.js
          grep -q 'Filtermaschine' facet-value-i18n.js
          grep -q 'FB_parseSearchIntent' search-intent.js
          grep -q 'mobile-search-tools' search-mobile.css
          grep -q 'data-catalog-url="development/core-products.json"' search.html
      - name: Test live search logic
        run: |
          node verify-live-facets.js
          node verify-search-intent.js
      - name: Package production files only
        run: |
          mkdir -p _site/development
          cp index.html search.html search.js search-i18n.js facet-schemas.js common-facet-defs.js category-aliases.js search-intent.js facet-value-i18n.js search-mobile.js search-mobile.css site-i18n.js i18n.js app.js styles.css home.css products.json impressum.html datenschutz.html robots.txt sitemap.xml CNAME 404.html _site/
          cp development/core-products.json _site/development/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
