name: Publish FundBlick production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fundblick-production-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate production JavaScript
        run: |
          for f in app.js i18n.js deal-of-day.js home-extras.js home-categories.js home-polish.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js search-state-guard.js catalog-loader.js image-fallback.js search.js coupon-engine.js search-relevance.js facet-value-i18n.js common-filter-i18n.js search-mobile.js results-paging.js page-meta-i18n.js live-health.js language-links.js affiliate-config.js affiliate-consent-version.js affiliate-consent.js affiliate-link-policy.js affiliate-outbound.js live-catalog-ui.js build-live-catalog.js verify-live-catalog-v2.js verify-coupon-engine.js verify-affiliate-routing.js verify-user-flows.js; do node --check "$f"; done
      - name: Build and validate production catalog
        run: |
          node build-live-catalog.js build/catalog
          node verify-live-catalog-v2.js build/catalog
          node verify-coupon-engine.js build/catalog
          node verify-affiliate-routing.js
          node verify-user-flows.js build/catalog
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/catalog/manifest.json'));if(m.dataMode!=='real'||m.realCount<1000||m.simulatedCount!==0)process.exit(1);console.log('Real production gate OK',m.realCount)"
          ! grep -R -E 'DemoMarkt|ShopTest|PreisDemo|FundBlick Simulator|Test-Gutschein' development/core-products.json build/catalog
      - name: Verify production wiring
        run: |
          grep -q 'data-catalog-url="catalog-live"' search.html
          grep -q 'live-catalog-ui.js' search.html
          grep -q 'home-categories.js' index.html
          grep -q 'href="/" data-i18n="homeLink"' search.html
          ! grep -q 'product-copy-i18n.js' search.html
          ! grep -q 'offer-comparison.js' search.html
          grep -q "network:'MULTI'" affiliate-config.js
          grep -q "defaultNetwork:'awin'" affiliate-config.js
          grep -q 'enabled:true' affiliate-config.js
          grep -q 'FundBlickAffiliateLinkPolicy' affiliate-link-policy.js
          grep -q 'FundBlickAffiliateOutbound' affiliate-outbound.js
          grep -q 'id="affiliate-awin"' datenschutz.html
          ! grep -q 'Live-Beta' index.html
      - name: Package production files only
        run: |
          mkdir -p _site
          cp index.html deal-of-day.js home-extras.js home-categories.js home-categories.css home-polish.js home-polish.css search.html search.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js search-state-guard.js catalog-loader.js image-fallback.js coupon-engine.js search-relevance.js facet-value-i18n.js common-filter-i18n.js search-mobile.js search-mobile.css results-paging.js results-paging.css page-meta-i18n.js live-health.js language-links.js live-catalog-ui.js affiliate-config.js affiliate-consent-version.js affiliate-consent.js affiliate-link-policy.js affiliate-outbound.js affiliate-consent.css i18n.js app.js styles.css home.css impressum.html datenschutz.html robots.txt sitemap.xml CNAME 404.html _site/
          cp -R build/catalog _site/catalog
          test ! -e _site/products.json
          test ! -e _site/development
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
