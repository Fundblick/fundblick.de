name: Publish FundBlick production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fundblick-production-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate live JavaScript
        run: |
          node --check app.js
          node --check i18n.js
          node --check search-i18n.js
          node --check facet-schemas.js
          node --check category-display-i18n.js
          node --check common-facet-defs.js
          node --check category-aliases.js
          node --check search-intent.js
          node --check search.js
          node --check product-copy-i18n.js
          node --check facet-value-i18n.js
          node --check common-filter-i18n.js
          node --check search-mobile.js
          node --check live-health.js
          node --check language-links.js
          node --check site-i18n.js
          node --check verify-live-facets.js
          node --check verify-search-intent.js
          node --check verify-live-health.js
          node --check verify-production-assets.js
          node --check verify-total-price-integrity.js
          node --check verify-language-navigation.js
          node --check verify-category-display-i18n.js
          node --check verify-product-copy-i18n.js
      - name: Verify live search assets
        run: |
          grep -q 'language-links.js' index.html
          grep -q 'search-i18n.js' search.html
          grep -q 'facet-schemas.js' search.html
          grep -q 'category-display-i18n.js' search.html
          grep -q 'common-facet-defs.js' search.html
          grep -q 'category-aliases.js' search.html
          grep -q 'search-intent.js' search.html
          grep -q 'product-copy-i18n.js' search.html
          grep -q 'facet-value-i18n.js' search.html
          grep -q 'common-filter-i18n.js' search.html
          grep -q 'search-mobile.js' search.html
          grep -q 'live-health.js' search.html
          grep -q 'language-links.js' search.html
          grep -q 'language-links.js' impressum.html
          grep -q 'language-links.js' datenschutz.html
          grep -q 'language-links.js' 404.html
          grep -q 'search-mobile.css' search.html
          grep -q 'value="zh-Hans"' search.html
          grep -q "'zh-Hans'" search-i18n.js
          grep -q 'FB_CATEGORY_SCHEMAS' facet-schemas.js
          grep -q 'FB_CATEGORY_DISPLAY_LABELS' category-display-i18n.js
          grep -q 'FB_COMMON_FACETS' common-facet-defs.js
          grep -q 'pistola de calor' category-aliases.js
          grep -q 'FBProductCopyI18n' product-copy-i18n.js
          grep -q 'Filtermaschine' facet-value-i18n.js
          grep -q 'FBCommonFilterI18n' common-filter-i18n.js
          grep -q 'FB_parseSearchIntent' search-intent.js
          grep -q 'FundBlickHealth' live-health.js
          grep -q 'FundBlickLanguageLinks' language-links.js
          grep -q 'mobile-search-tools' search-mobile.css
          grep -q 'data-catalog-url="development/core-products.json"' search.html
      - name: Test live search logic
        run: |
          node verify-live-facets.js
          node verify-search-intent.js
          node verify-live-health.js
          node verify-production-assets.js
          node verify-total-price-integrity.js
          node verify-language-navigation.js
          node verify-category-display-i18n.js
          node verify-product-copy-i18n.js
      - name: Package production files only
        run: |
          mkdir -p _site/development
          cp index.html search.html search.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js product-copy-i18n.js facet-value-i18n.js common-filter-i18n.js search-mobile.js search-mobile.css live-health.js language-links.js site-i18n.js i18n.js app.js styles.css home.css products.json impressum.html datenschutz.html robots.txt sitemap.xml CNAME 404.html _site/
          cp development/core-products.json _site/development/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
