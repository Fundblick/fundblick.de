name: Publish FundBlick production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fundblick-production-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate production JavaScript
        run: |
          for f in app.js i18n.js home-i18n.js deal-of-day.js home-deal.js home-extras.js home-categories.js home-polish.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js search-state-guard.js catalog-loader.js image-fallback.js search.js coupon-engine.js merchant-offers.js search-relevance.js facet-value-i18n.js common-filter-i18n.js search-mobile.js results-paging.js page-meta-i18n.js live-health.js language-links.js equestrian-search-extension.js equestrian-taxonomy-i18n.js affiliate-config.js affiliate-consent-version.js affiliate-consent.js affiliate-link-policy.js affiliate-outbound.js live-catalog-ui.js build-live-catalog.js build-production-catalog.js build-seo-landings.js audit-seo-landing-candidates.js build-versioned-site.js verify-live-catalog-v2.js verify-production-merchants.js verify-production-categories.js verify-deal-of-day.js verify-production-deal.js verify-coupon-engine.js verify-merchant-offers.js verify-affiliate-routing.js verify-user-flows.js verify-google-indexability.js; do node --check "$f"; done
          for f in search-static-i18n.js taxonomy-value-i18n.js category-query-router.js universal-search-intent.js search-intent-query.js search-intent-ui.js search-facet-engine-v2.js search-render-signal.js search-sort-runtime.js external-search-policy.js external-search-client.js external-search-i18n.js external-price-evidence.js external-search-ui.js external-price-confidence.js product-storage-parser.js product-fashion-attributes.js product-intelligence-core.js semantic-product-resolver.js semantic-taxonomy-adapter.js query-facet-blueprint.js query-blueprint-ui.js product-query-strategy.js product-unit-normalizer.js product-result-attribute-extractor.js product-result-deduper.js product-facet-engine.js product-constraint-ranker.js product-conflict-filter.js product-intelligence-pipeline.js external-intelligence-ui.js external-result-page.js external-search-runtime.js verify-query-facet-blueprint.js verify-query-to-facet-integration.js verify-generic-semantic-facets.js; do node --check "$f"; done
          node verify-query-facet-blueprint.js
          node verify-semantic-product-resolver.js
          node verify-generic-semantic-facets.js
          node verify-query-to-facet-integration.js
      - name: Build and validate production catalog
        run: |
          node verify-merchant-product-quality.js
          node verify-deal-of-day.js
          node verify-merchant-offers.js
          node build-production-catalog.js build/catalog
          node verify-live-catalog-v2.js build/catalog
          node verify-production-merchants.js build/catalog
          node verify-production-categories.js build/catalog
          node verify-production-deal.js build/catalog
          node verify-coupon-engine.js build/catalog
          node verify-affiliate-routing.js
          node verify-user-flows.js build/catalog
          node audit-seo-landing-candidates.js
          node build-seo-landings.js build/catalog build/seo
          node verify-google-indexability.js build/seo
          test "$(find build/seo/themen -name index.html | wc -l)" -eq 6
          test -s build/seo/sitemap.xml
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/catalog/manifest.json'));if(m.dataMode!=='real'||m.realCount<1000||m.simulatedCount!==0)process.exit(1);console.log('Real production gate OK',m.realCount)"
          ! grep -R -E 'DemoMarkt|ShopTest|PreisDemo|FundBlick Simulator|Test-Gutschein' development/core-products.json development/ahipos-products-1.json development/ahipos-products-2.json build/catalog
      - name: Verify production wiring
        run: |
          grep -q 'data-catalog-url="catalog-live"' search.html
          grep -q 'merchant-offers.js' search.html
          grep -q 'live-catalog-ui.js' search.html
          grep -q 'result-card.css' search.html
          grep -q 'semantic-taxonomy-adapter.js' search.html
          grep -q 'query-facet-blueprint.js' search.html
          grep -q 'query-blueprint-ui.js' search.html
          grep -q 'external-search-runtime.js' search.html
          grep -q 'equestrian-search-extension.js' search.html
          grep -q 'equestrian-taxonomy-i18n.js' search.html
          grep -q 'search.html?category=home.living' index.html
          grep -q 'search.html?category=home.furniture' index.html
          grep -q 'search.html?category=home.lighting' index.html
          grep -q 'search.html?category=home.decor' index.html
          grep -q 'search.html?category=pet.equestrian' index.html
          grep -q 'search.html?category=pet.dog' index.html
          grep -q 'search.html?category=health.supplements' index.html
          ! grep -q 'href="/themen/' index.html
          grep -q 'home-i18n.js' index.html
          grep -q 'catalog-loader.js' index.html
          grep -q 'deal-of-day.js' index.html
          grep -q 'home-deal.js' index.html
          grep -q 'id="deal-content"' index.html
          grep -q 'home-categories.js' index.html
          test -s build/catalog/categories.json
          test -s build/seo/themen/moebel/index.html
          test -s build/seo/themen/pferd-reitsport/index.html
          grep -q 'https://fundblick.de/themen/moebel/' build/seo/sitemap.xml
          grep -q 'href="/" data-i18n="homeLink"' search.html
          ! grep -q 'product-copy-i18n.js' search.html
          ! grep -q 'offer-comparison.js' search.html
          grep -q "network:'MULTI'" affiliate-config.js
          grep -q "defaultNetwork:'awin'" affiliate-config.js
          grep -q 'enabled:true' affiliate-config.js
          grep -q 'FundBlickAffiliateLinkPolicy' affiliate-link-policy.js
          grep -q 'FundBlickAffiliateOutbound' affiliate-outbound.js
          grep -q 'id="affiliate-awin"' datenschutz.html
          ! grep -q 'Live-Beta' index.html
      - name: Package production files only
        run: |
          mkdir -p _site
          cp index.html deal-of-day.js home-deal.js home-extras.js home-categories.js home-categories.css home-polish.js home-polish.css search.html search.js search-i18n.js facet-schemas.js category-display-i18n.js common-facet-defs.js category-aliases.js search-intent.js search-state-guard.js catalog-loader.js image-fallback.js coupon-engine.js merchant-offers.js search-relevance.js facet-value-i18n.js common-filter-i18n.js search-mobile.js search-mobile.css results-paging.js results-paging.css result-card.css page-meta-i18n.js live-health.js language-links.js live-catalog-ui.js equestrian-search-extension.js equestrian-taxonomy-i18n.js affiliate-config.js affiliate-consent-version.js affiliate-consent.js affiliate-link-policy.js affiliate-outbound.js affiliate-consent.css i18n.js app.js styles.css home.css impressum.html datenschutz.html robots.txt CNAME 404.html _site/
          cp search-static-i18n.js category-query-router.js universal-search-intent.js search-intent-query.js search-intent-ui.js search-facet-engine-v2.js search-render-signal.js search-sort-runtime.js external-search-policy.js external-search-client.js external-search-i18n.js external-price-evidence.js external-search-ui.js external-price-confidence.js product-storage-parser.js product-fashion-attributes.js product-intelligence-core.js semantic-product-resolver.js semantic-taxonomy-adapter.js query-facet-blueprint.js query-blueprint-ui.js product-query-strategy.js product-unit-normalizer.js product-result-attribute-extractor.js product-result-deduper.js product-facet-engine.js product-constraint-ranker.js product-conflict-filter.js product-intelligence-pipeline.js external-intelligence-ui.js external-result-page.js external-search-runtime.js search-polish.css external-search.css _site/
          cp -R build/catalog _site/catalog
          cp -R build/seo/themen _site/themen
          cp build/seo/sitemap.xml _site/sitemap.xml
          test -s _site/themen/moebel/index.html
          test -s _site/themen/pferd-reitsport/index.html
          test -s _site/sitemap.xml
          test ! -e _site/products.json
          test ! -e _site/development
          touch _site/.nojekyll
      - name: Version production assets by content
        run: |
          node build-versioned-site.js
          test -s _site/asset-manifest.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('_site/asset-manifest.json'));if(!m.assets||!Object.keys(m.assets).length)process.exit(1);for(const [src,dst] of Object.entries(m.assets)){if(src===dst||!/\.[a-f0-9]{12}\.(js|css)$/.test(dst)||!fs.existsSync('_site/'+dst))process.exit(1)};console.log('Hashed asset gate OK',Object.keys(m.assets).length)"
      - name: Verify packaged production dependencies
        run: node development/verify-production-package.js _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
