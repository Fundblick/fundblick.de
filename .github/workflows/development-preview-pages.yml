name: Development Preview Build

on:
  push:
    branches:
      - development
  workflow_dispatch:

# Public preview publishing is intentionally separate from production GitHub Pages.
# Cloudflare preview host trigger: development branch source verified 2026-10-01.
# Cloudflare build configuration now creates the isolated _site package before deploy.
# When an isolated host is connected, it must consume only the validated artifact below.

permissions:
  contents: read

concurrency:
  group: development-preview-build
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v6
        with:
          ref: development

      - name: Build portable isolated development preview
        run: node development/build-cloudflare-preview.js

      - name: Protect isolated preview from search indexing
        run: |
          node development/verify-preview-indexing.js
          node development/protect-preview-indexing.js _site
          grep -Fq 'noindex,nofollow' _site/index.html
          grep -Fq 'noindex,nofollow' _site/search.html
          ! grep -q 'Sitemap:' _site/robots.txt

      - name: Assert production Pages isolation
        run: |
          set -euo pipefail
          ! grep -q 'pages: write' .github/workflows/development-preview-pages.yml
          ! grep -q 'id-token: write' .github/workflows/development-preview-pages.yml
          ! grep -q 'name: github-pages' .github/workflows/development-preview-pages.yml
          ! grep -q 'configure-pages' .github/workflows/development-preview-pages.yml
          ! grep -q 'upload-pages-artifact' .github/workflows/development-preview-pages.yml
          ! grep -q 'deploy-pages' .github/workflows/development-preview-pages.yml
          echo 'Development preview is isolated from GitHub Pages production deployment.'

      - name: Verify Cloudflare preview deployment contract
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));if(c.name!=='fundblick-development'||c.assets?.directory!=='./_site'||c.assets?.not_found_handling!=='404-page')process.exit(1);console.log('Cloudflare preview contract OK')"
          test -f _site/index.html
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/docs

      - name: Deploy isolated preview to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.145.0 deploy

      - name: Upload development preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundblick-development-preview
          path: _site
          retention-days: 7
          if-no-files-found: error

      - name: Preview hosting handoff summary
        run: |
          echo 'Preview package validated and ready for an isolated host.'
          echo 'Planned hostname: dev.fundblick.de'
          echo 'Production main/fundblick.de are not deployment targets of this workflow.'
          echo 'Artifact: fundblick-development-preview (7-day retention, noindex/nofollow).'
          echo 'Cloudflare Workers Static Assets must publish _site only, never the repository root.'
