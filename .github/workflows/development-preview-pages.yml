name: Development Preview Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

concurrency:
  group: development-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v6
        with:
          ref: development

      - name: Build current development preview
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'CNAME'
          touch _site/.nojekyll
          test -f _site/index.html
          grep -Fq 'Suchen. Angebote vergleichen. Fertig.' _site/index.html
          grep -Fq 'action="search.html"' _site/index.html
          grep -Fq 'external-search-runtime.js' _site/search.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
