name: External Search Fallback

on:
  push:
    branches:
      - 'dev/external-search-fallback-*'
  pull_request:
    paths:
      - 'search.html'
      - 'external-search.js'
      - 'external-search-i18n.js'
      - 'external-query-pack-provider.js'
      - 'development/external-query-pack-fixture.json'
      - 'external-search.css'
      - 'external-search-e2e.spec.js'
      - 'verify-external-search-fallback.js'
      - '.github/workflows/external-search-fallback.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and static safety checks
        run: |
          node --check external-search.js
          node --check external-search-i18n.js
          node --check external-query-pack-provider.js
          node --check external-search-e2e.spec.js
          node verify-external-search-fallback.js

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local FundBlick site
        run: |
          python3 -m http.server 4173 >/tmp/fundblick-external-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/search.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fundblick-external-http.log
          exit 1
      - name: External fallback browser regression
        run: npx playwright test external-search-e2e.spec.js --reporter=line --workers=1
