name: External Search Fallback

on:
  push:
    branches:
      - 'dev/external-search-fallback-*'
  pull_request:
    paths:
      - 'search.html'
      - 'external-search.js'
      - 'external-search.css'
      - 'verify-external-search-fallback.js'
      - '.github/workflows/external-search-fallback.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node verify-external-search-fallback.js
