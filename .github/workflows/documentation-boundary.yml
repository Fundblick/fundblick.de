name: Private documentation boundary

on:
  push:
    branches: [main, development]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '**/internal-docs/**'
      - 'private-docs/**'
      - 'verify-documentation-boundary.js'
      - '.github/workflows/documentation-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '**/internal-docs/**'
      - 'private-docs/**'
      - 'verify-documentation-boundary.js'
      - '.github/workflows/documentation-boundary.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node verify-documentation-boundary.js
